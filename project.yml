name: ShadowSwitch
options:
  bundleIdPrefix: com.connexa
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: B97SQSQBMR
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "2"
    CODE_SIGN_STYLE: Automatic
targets:
  ShadowSwitch:
    type: application
    platform: iOS
    sources:
      - path: ShadowSwitch/Sources
      - path: ShadowSwitch/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.connexa.shadowswitch
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: ShadowSwitch/Info.plist
        ENABLE_PREVIEWS: YES
    info:
      path: ShadowSwitch/Info.plist
      properties:
        CFBundleDisplayName: Shadow Switch
        LSApplicationCategoryType: public.app-category.arcade-games
        ITSAppUsesNonExemptEncryption: false
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UILaunchScreen:
          UIColorName: LaunchBG
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        CFBundleURLTypes:
          - CFBundleURLName: com.connexa.shadowswitch
            CFBundleURLSchemes: [shadowswitch]
schemes:
  ShadowSwitch:
    build:
      targets:
        ShadowSwitch: all
    run:
      storeKitConfiguration: ShadowSwitch/Products.storekit
